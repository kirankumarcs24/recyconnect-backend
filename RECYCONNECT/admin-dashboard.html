<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport"
        content="width=device-width,initial-scale=1" />

  <title>Admin Dashboard - RecyConnect</title>

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@500;700;900&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Roboto:wght@400;700;900&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>

    .stats-container {

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;

    }

    .stat-card {

      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);

    }

    .stat-card h3 {

      color: #fff;
      margin-bottom: 10px;
      font-size: 1.2rem;

    }

    .stat-card p {

      font-size: 2rem;
      font-weight: bold;
      color: #9ca81a;

    }

    .welcome-box {

      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 18px;
      color: white;
      border: 1px solid rgba(255,255,255,0.08);

    }

    .welcome-box h2 {

      margin-bottom: 10px;

    }

    .welcome-box p {

      color: #ccc;

    }

  </style>

</head>

<body>

  <header class="site-header">

    <div class="wrap">

      <div class="brand">

        <div class="logo">♻️</div>

        <h1>RecyConnect</h1>

      </div>

      <nav class="site-nav">

        <a href="admin-dashboard.html"
           class="active">

          Dashboard

        </a>

        <a href="requests.html">

          Requests

        </a>

        <a href="users.html">

          Users

        </a>

        <a href="analytics.html">

          Analytics

        </a>

        <a href="admin-login.html">

          Logout

        </a>

      </nav>

      <button class="hamburger"
              onclick="document.body.classList.toggle('nav-open')">

        ☰

      </button>

    </div>

  </header>

  <main class="wrap section">

    <div class="welcome-box">

      <h2>

        Welcome Admin 👋

      </h2>

      <p>

        Manage recycling requests, monitor users,
        and track waste collection statistics.

      </p>

    </div>

    <br>

    <div class="stats-container">

      <div class="stat-card">

        <h3>Total Users</h3>

        <p id="totalUsers">0</p>

      </div>

      <div class="stat-card">

        <h3>Total Requests</h3>

        <p id="totalRequests">0</p>

      </div>

      <div class="stat-card">

        <h3>Approved</h3>

        <p id="approvedRequests">0</p>

      </div>

      <div class="stat-card">

        <h3>Pending</h3>

        <p id="pendingRequests">0</p>

      </div>

    </div>

  </main>

  <footer class="site-footer">

    <div class="wrap footer-grid">

      <p class="muted small">

        © 2026 RecyConnect

      </p>

      <nav class="footer-nav">

        <a href="admin-dashboard.html">

          Dashboard

        </a>

        <a href="about.html">

          About

        </a>

      </nav>

    </div>

  </footer>

  <script>

    async function loadStats() {

      try {

        const response =
          await fetch("http://localhost:5000/admin/stats");

        const data = await response.json();

        document.getElementById("totalUsers").innerText =
          data.totalUsers;

        document.getElementById("totalRequests").innerText =
          data.totalRequests;

        document.getElementById("approvedRequests").innerText =
          data.approvedRequests;

        document.getElementById("pendingRequests").innerText =
          data.pendingRequests;

      } catch (error) {

        console.log(error);

      }

    }

    loadStats();

  </script>

</body>

</html>
