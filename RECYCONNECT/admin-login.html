<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport"
        content="width=device-width,initial-scale=1" />

  <title>Admin Login - RecyConnect</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="site-header">

    <div class="wrap">

      <div class="brand">

        <div class="logo">♻️</div>

        <h1>RecyConnect</h1>

      </div>

      <nav class="site-nav">

        <a href="admin-login.html" class="active">

          Admin Login

        </a>

      </nav>

    </div>

  </header>

  <main class="wrap section">

    <div style="
      max-width:400px;
      margin:50px auto;
      padding:30px;
      background:rgba(255,255,255,0.05);
      border-radius:15px;
      border:1px solid rgba(255,255,255,0.1);
    ">

      <h2 style="
        text-align:center;
        color:#fff;
        margin-bottom:20px;
      ">

        Admin Login

      </h2>

      <form id="loginForm">

        <div style="margin-bottom:15px;">

          <label style="
            color:#ccc;
            display:block;
            margin-bottom:5px;
          ">

            Email Address

          </label>

          <input type="email"
                 id="email"
                 required
                 style="
                   width:100%;
                   padding:10px;
                   border-radius:5px;
                   border:none;
                 ">

        </div>

        <div style="margin-bottom:15px;">

          <label style="
            color:#ccc;
            display:block;
            margin-bottom:5px;
          ">

            Password

          </label>

          <input type="password"
                 id="password"
                 required
                 style="
                   width:100%;
                   padding:10px;
                   border-radius:5px;
                   border:none;
                 ">

        </div>

        <div style="
          text-align:right;
          margin-bottom:20px;
        ">

          <a href="forgot-password.html"
             style="
               color:#9ca81a;
               font-size:0.9rem;
               text-decoration:none;
             ">

            Forgot Password?

          </a>

        </div>

        <button type="submit"
                class="btn btn-primary"
                style="width:100%;">

          Login

        </button>

      </form>

      <p id="errorMsg"
         style="
           color:#ff6b6b;
           text-align:center;
           margin-top:15px;
           display:none;
         ">

      </p>

    </div>

  </main>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", (e) => {

      e.preventDefault();

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const errorMsg =
        document.getElementById("errorMsg");

      const admins = [

        {

          email: "kiran@gmail.com",
          password: "kiran123"

        },

        {

          email: "hritika@gmail.com",
          password: "hritika123"

        },

        {

          email: "koshalendar@gmail.com",
          password: "koshalendar123"

        },

        {

          email: "gangambika@gmail.com",
          password: "gangambika123"

        }

      ];

      const validAdmin =
        admins.find(admin =>

          admin.email === email &&
          admin.password === password

      );

      if(validAdmin) {

        // STORE CURRENT ADMIN EMAIL
        localStorage.setItem(
          "adminEmail",
          email
        );

        // STORE ADMIN NAME
        localStorage.setItem(
          "adminName",
          email.split("@")[0]
        );

        // REDIRECT
        window.location.href =
          "admin-dashboard.html";

      }

      else {

        errorMsg.textContent =
          "Invalid Admin Credentials";

        errorMsg.style.display =
          "block";

      }

    });

  </script>

</body>

</html>
