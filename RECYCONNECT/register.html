<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - RecyConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <div class="logo">♻️</div>
        <h1>RecyConnect</h1>
      </div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="active">Register</a>
      </nav>
    </div>
  </header>

  <main class="wrap section">
    <div style="max-width: 400px; margin: 50px auto; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);">
      <h2 style="text-align: center; color: #fff; margin-bottom: 20px;">Create Account</h2>
      
      <form id="registerForm">
        <div style="margin-bottom: 15px;">
          <label style="color: #ccc; display: block; margin-bottom: 5px;">Full Name</label>
          <input type="text" id="name" required style="width: 100%; padding: 10px; border-radius: 5px; border: none;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #ccc; display: block; margin-bottom: 5px;">Email Address</label>
          <input type="email" id="email" required style="width: 100%; padding: 10px; border-radius: 5px; border: none;">
        </div>
        
        <div style="margin-bottom: 15px;">
          <label style="color: #ccc; display: block; margin-bottom: 5px;">Password</label>
          <input type="password" id="password" required style="width: 100%; padding: 10px; border-radius: 5px; border: none;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
      </form>

      <p id="message" style="color: #9ca81a; text-align: center; margin-top: 15px;"></p>

      <div style="text-align: center; margin-top: 20px; color: #aaa; font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: #fff; text-decoration: underline;">Login here</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await response.json();
        
        if (response.ok) {
          message.style.color = '#9ca81a';
          message.textContent = "Success! Redirecting to login...";
          setTimeout(() => {
            window.location.href = 'login.html'; // Redirects to login after signup
          }, 1500);
        } else {
          message.style.color = '#ff6b6b';
          message.textContent = data.error;
        }
      } catch (err) {
        message.textContent = "Error connecting to server";
      }
    });
  </script>
</body>
</html>
